name: Publicar coleta aprovada do PC
on:
  push:
    branches: [site-publicado]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bussola-publicacao
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/site-publicado'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir integridade e aprovação do pacote recebido
        run: python verificar_pacote.py dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
